name: Collect diya links

on:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          FORM_CSV_URL: ${{ vars.FORM_CSV_URL }}
        run: python scrape.py
      - name: Commit if changed
        run: |
          git config user.name "diya-wall-bot"
          git config user.email "diya-wall-bot@users.noreply.github.com"
          git add links.json
          git diff --cached --quiet || (git commit -m "Update links" && git push)
